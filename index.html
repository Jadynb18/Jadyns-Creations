<html>

<head>

    <title>Forms Example</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;

        }

        #submitBtn:hover {
            background-color: darkslategrey;
        }

        <style><link rel="stylesheet" href='styles.css'></head><body><h1>The input value attribute</h1><p>The value attribute specifies an initial value for an input field:</p><form action="/action_page.php"><label for="fname">First name:</label><br><input type="text" id="fname" name="fname" value="John"><br><label for="lname">Last name:</label><br><input type="text" id="lname" name="lname" value="Doe"><br><br><input type="submit" value="Submit">id="submitBtn"></form></body></html>
